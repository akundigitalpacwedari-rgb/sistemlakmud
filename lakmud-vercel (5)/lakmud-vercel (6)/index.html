<style>
  .hide { display: none !important; }
  .print-only { display: none; }

  /* Tombol & Interaksi */
  button, select, input[type="file"]::file-selector-button { transition: transform .18s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease, border-color .2s ease; }
  button { position: relative; overflow: hidden; cursor: pointer; }
  button::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;

  }
  button:not(:disabled):hover::after { transform: translateX(120%); }
  button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(11,61,46,.55); }
  button:not(:disabled):active { transform: translateY(0) scale(.96); box-shadow: none; }

  .lift { transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -14px rgba(11,61,46,.35); }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  main > *:nth-child(4) { animation-delay: .15s; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes shine { 0% { transform: translateX(-140%) skewX(-20deg); } 55%, 100% { transform: translateX(260%) skewX(-20deg); } }
  .logo-wrap { position: relative; overflow: hidden; display: inline-block; }
  .logo-wrap::after {
    content: ''; position: absolute; top: -10%; bottom: -10%; width: 40%; left: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shine 4.5s ease-in-out infinite; pointer-events: none;
  }
  .logo-float { animation: float 5s ease-in-out infinite; }

  }
  h1, h2, h3, .font-extrabold { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .shadow-card { box-shadow: none !important; }
  .rounded-3xl { border-radius: 18px !important; }
  .rounded-2xl { border-radius: 14px !important; }
  .rounded-xl { border-radius: 10px !important; }
  section { border: 1px solid #DDD6C4; }

  .bg-ipnu-900.rounded-3xl { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 1px, transparent 1px 16px); }

  .role-tile {
    position: relative; overflow: hidden; border-radius: 20px; background: #fff;
    border: 1px solid #e2e8f0; padding: 1.1rem; min-height: 132px; text-align: left;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms);
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, border-color .3s ease;
  }
  .role-tile::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, #1E7F5C, #A3E635); transform: scaleX(0); transform-origin: left;
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .role-tile .ico {
    display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px;
    background: #E6F5EC; color: #0B3D2E; transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .3s ease, color .3s ease;
  }
  button.role-tile:not(:disabled):hover {
    transform: translateY(-6px); border-color: #1E7F5C;
    box-shadow: 0 22px 40px -18px rgba(11,61,46,.55), 0 0 0 4px rgba(163,230,53,.18);
  }
  button.role-tile:not(:disabled):hover::before { transform: scaleX(1); }
  button.role-tile:not(:disabled):hover .ico { transform: rotate(-8deg) scale(1.1); background: #A3E635; color: #0B3D2E; }
  button.role-tile:not(:disabled):active { transform: translateY(-2px) scale(.97); }

  .panduan summary .caret { transition: transform .3s ease; }

</style>

    appState.role = role;
    appState.user = USERS[role];

    document.getElementById('app').classList.remove('hide');
    renderApp();
    showToast(`Berhasil masuk sebagai ${appState.user.name}`);
  }

  function logout() {
    appState.role = null;
    appState.user = null;
    document.getElementById('app').classList.add('hide');
    initLogin();
    showToast('Keluar dari sesi sistem', 'info');
  }

  function setTab(t) {
    appState.tab = t;
    renderApp();
    window.scrollTo({ top: 0, behavior: 'smooth' });

        <div class="bg-white p-6 rounded-2xl border border-slate-200">
          <h3 class="text-lg font-extrabold text-ipnu-900">Jadwal & Presensi Kegiatan LAKMUD</h3>
          <p class="text-xs text-slate-500">Rangkaian acara pelatihan dan catatan kehadiran kader selama diklat.</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
          <div class="p-4 bg-slate-50 border-b border-slate-200 font-extrabold text-xs text-slate-700 uppercase">Agenda Kegiatan LAKMUD</div>
          <div class="divide-y divide-slate-100">
            ${appState.jadwalList.map(j => `
              <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div class="space-y-0.5">
                  <div class="font-extrabold text-ipnu-900 text-sm">${j.acara}</div>
                  <div class="text-xs text-slate-500">Lokasi: <span class="font-semibold text-slate-700">${j.tempat}</span></div>
                </div>
                <span class="px-3 py-1.5 rounded-xl bg-ipnu-50 text-ipnu-900 text-xs font-extrabold w-max border border-ipnu-200">${j.waktu}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

          <h3 class="text-lg font-extrabold text-ipnu-900">Panduan & Regulasi LAKMUD</h3>
          <p class="text-xs text-slate-500">Ketentuan umum, tata tertib, serta pedoman perkaderan Pelajar NU.</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4 text-xs text-slate-600 panduan">

            <p class="mt-2 text-slate-500 leading-relaxed">Kelulusan ditentukan berdasarkan tingkat kehadiran (minimal 90%), penyelesaian seluruh tugas penugasan, keaktifan dalam Forum Group Discussion (FGD), serta ujian komprehensif di akhir pelatihan.</p>

  function openTambahPesertaModal() {
    const body = document.getElementById('modal-body');
    body.innerHTML = `
      <div class="space-y-4">
        <h3 class="text-lg font-extrabold text-ipnu-900">Tambah Kader Peserta Baru</h3>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Nama Lengkap & Gelar</label>
            <input type="text" id="inp-nama" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-ipnu-500" placeholder="Contoh: Muhammad Ali">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Pimpinan Ranting / Asal</label>
            <input type="text" id="inp-pimpinan" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-ipnu-500" placeholder="Contoh: PR IPNU Kedungel">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Badan (IPNU / IPPNU)</label>
            <select id="inp-gender" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-ipnu-500">
              <option value="Putra">Putra (IPNU)</option>
              <option value="Putri">Putri (IPPNU)</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeEdit()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Batal</button>
          <button onclick="simpanPesertaBaru()" class="px-4 py-2 rounded-xl bg-ipnu-900 text-white font-bold text-xs hover:bg-ipnu-800">Simpan Data</button>
        </div>
      </div>
    `;
    document.getElementById('modal').classList.remove('hide');
  }

  function simpanPesertaBaru() {
    const nama = document.getElementById('inp-nama').value;
    const pimpinan = document.getElementById('inp-pimpinan').value;
    const gender = document.getElementById('inp-gender').value;
    if(!nama || !pimpinan) {
      showToast('Mohon isi semua data dengan lengkap!', 'error');
      return;
    }
    const newId = 'P-0' + (appState.pesertaList.length + 1);
    appState.pesertaList.push({ id: newId, nama, pimpinan, gender, status: 'Aktif', nilai: 80, absensi: 'Hadir' });
    closeEdit();
    renderApp();
    showToast('Peserta baru berhasil ditambahkan!');
  }

  function editPeserta(id) {
    const p = appState.pesertaList.find(x => x.id === id);
    if(!p) return;
    const body = document.getElementById('modal-body');
    body.innerHTML = `
      <div class="space-y-4">
        <h3 class="text-lg font-extrabold text-ipnu-900">Edit Data Kader (${p.id})</h3>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Nama Lengkap</label>
            <input type="text" id="edit-nama" value="${p.nama}" class="w-full px-3 py-2 rounded-xl border border-slate-300">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Pimpinan Ranting</label>
            <input type="text" id="edit-pimpinan" value="${p.pimpinan}" class="w-full px-3 py-2 rounded-xl border border-slate-300">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Nilai Akhir</label>
            <input type="number" id="edit-nilai" value="${p.nilai}" class="w-full px-3 py-2 rounded-xl border border-slate-300">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="closeEdit()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">Batal</button>
          <button onclick="updatePeserta('${p.id}')" class="px-4 py-2 rounded-xl bg-ipnu-900 text-white font-bold text-xs">Perbarui</button>
        </div>
      </div>
    `;
    document.getElementById('modal').classList.remove('hide');
  }

  function updatePeserta(id) {
    const p = appState.pesertaList.find(x => x.id === id);
    if(p) {
      p.nama = document.getElementById('edit-nama').value;
      p.pimpinan = document.getElementById('edit-pimpinan').value;
      p.nilai = parseInt(document.getElementById('edit-nilai').value) || 0;
    }
    closeEdit();
    renderApp();
    showToast('Data kader berhasil diperbarui!');
  }

  function hapusPeserta(id) {
    if(confirm('Yakin ingin menghapus kader ini dari sistem?')) {
      appState.pesertaList = appState.pesertaList.filter(x => x.id !== id);
      renderApp();
      showToast('Kader berhasil dihapus', 'info');
    }
  }

  function openCetakModal() {
    const body = document.getElementById('modal-body');
    body.innerHTML = `
      <div class="space-y-4 text-center">
        <div class="mx-auto w-12 h-12 rounded-2xl bg-ipnu-100 text-ipnu-900 flex items-center justify-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        </div>
        <h3 class="text-lg font-extrabold text-ipnu-900">Cetak Laporan / Rekap LAKMUD</h3>
        <p class="text-xs text-slate-500">Pilih jenis laporan rekapitulasi kegiatan LAKMUD PAC IPNU IPPNU Wedarijaksa 2026 untuk diunduh atau dicetak.</p>
        <div class="grid grid-cols-1 gap-2 pt-2 text-xs font-bold">
          <button onclick="window.print(); closeEdit();" class="w-full py-3 rounded-xl bg-ipnu-900 text-white hover:bg-ipnu-800 transition">Cetak Rekap Nilai & Peserta</button>
          <button onclick="showToast('Mengunduh laporan presensi...'); closeEdit();" class="w-full py-3 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Unduh Rekap Presensi (PDF)</button>
        </div>
      </div>
    `;
    document.getElementById('modal').classList.remove('hide');
  }

  function closeEdit() {
    document.getElementById('modal').classList.add('hide');
  }

  /* ================= FITUR REAL-TIME OTOMATIS DI LATAR BELAKANG ================= */
  function initBackgroundRealTime() {
    // 1. Pembaruan Jam Real-Time Otomatis setiap detik
    setInterval(() => {
      const clockEl = document.getElementById('realtime-clock');
      if (clockEl) {
        const now = new Date();
        clockEl.innerText = now.toLocaleTimeString('id-ID');
      }
    }, 1000);

    // 2. Simulasi Background Sync / Pembaruan Data Real-Time Otomatis (setiap 30 detik)
    setInterval(() => {
      // Background ping / pembaruan otomatis status koneksi atau sinkronisasi data sistem
      if (appState.role) {
        console.log('[Real-Time Background Sync] Sinkronisasi data server LAKMUD berhasil dijalankan:', new Date().toLocaleTimeString());
      }
    }, 30000);
  }

  // Inisialisasi awal saat dokumen dimuat
  window.addEventListener('DOMContentLoaded', () => {
    initLogin();
    initBackgroundRealTime(); // Menjalankan fungsi real-time otomatis di latar belakang
  });
</script>
</body>
</html>
