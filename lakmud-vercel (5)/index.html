<style>
  .hide { display: none !important; }
  .print-only { display: none; }

  /* Tombol: setiap tombol bergerak saat disentuh, ditekan, atau fokus */
  button, select, input[type="file"]::file-selector-button { transition: transform .18s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease, border-color .2s ease; }
  button { position: relative; overflow: hidden; cursor: pointer; }
  button::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
    transform: translateX(-120%); transition: transform .65s ease;
  }
  button:not(:disabled):hover::after { transform: translateX(120%); }
  button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(11,61,46,.55); }
  button:not(:disabled):active { transform: translateY(0) scale(.96); box-shadow: none; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .lift { transition: transform .25s ease, box-shadow .25s ease; }
  .lift:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -14px rgba(11,61,46,.35); }

  /* Kartu masuk bertahap */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  main > *, #login-card > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
  main > *:nth-child(2) { animation-delay: .05s; }
  main > *:nth-child(3) { animation-delay: .1s; }
  main > *:nth-child(4) { animation-delay: .15s; }
  main > *:nth-child(5) { animation-delay: .2s; }

  /* Logo bergerak: melayang dan kilau */
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  @keyframes shine { 0% { transform: translateX(-140%) skewX(-20deg); } 55%, 100% { transform: translateX(260%) skewX(-20deg); } }
  .logo-wrap { position: relative; overflow: hidden; display: inline-block; }
  .logo-wrap::after {
    content: ''; position: absolute; top: -10%; bottom: -10%; width: 40%; left: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shine 4.5s ease-in-out infinite; pointer-events: none;
  }
  .logo-float { animation: float 5s ease-in-out infinite; }
  .logo-float.delay { animation-delay: -2.5s; }
  .logo-spin { animation: spin-slow 40s linear infinite; }

  /* Karakter putra dan putri: bergoyang, melompat ringan, dan berkilau */
  @keyframes bob-a { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
  @keyframes bob-b { 0%,100% { transform: translateY(0) rotate(1deg); } 50% { transform: translateY(-10px) rotate(-1deg); } }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
  .chara { transform-origin: 50% 100%; animation: bob-a 3.2s ease-in-out infinite; }
  .chara.b { animation-name: bob-b; animation-delay: -1.4s; }
  .chara-wrap { position: relative; }
  .chara-wrap:hover .chara { animation-duration: 1.1s; }
  .spark { position: absolute; width: 18px; height: 18px; color: #A3E635; animation: twinkle 2.6s ease-in-out infinite; }
  .spark.s2 { animation-delay: -.9s; } .spark.s3 { animation-delay: -1.7s; }

  /* Indikator langsung */
  @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(163,230,53,.7); } 100% { box-shadow: 0 0 0 10px rgba(163,230,53,0); } }
  .live-dot { width: 9px; height: 9px; border-radius: 999px; background: #A3E635; animation: pulse-dot 1.6s infinite; display: inline-block; }

  /* Tampilan: kertas hangat, judul serif, garis tipis, tanpa bayangan template */
  body {
    background-color: #F5F1E6;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04  0 0 0 0 0.24  0 0 0 0 0.18  0 0 0 .08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  h1, h2, h3, .font-extrabold { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .shadow-card { box-shadow: none !important; }
  .rounded-3xl { border-radius: 18px !important; }
  .rounded-2xl { border-radius: 14px !important; }
  .rounded-xl { border-radius: 10px !important; }
  section { border: 1px solid #DDD6C4; }
  section > h3 { border-bottom: 1px solid #E6DFCB; padding-bottom: .6rem; }
  .bg-ipnu-900.rounded-3xl { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 1px, transparent 1px 16px); }
  .masthead { border-top: 3px double #0B3D2E; border-bottom: 1px solid #0B3D2E; }
  .no-num { font-family: 'Fraunces', Georgia, serif; font-weight: 800; color: #1E7F5C; font-size: 2.25rem; line-height: 1; }
  .panduan details { border-top: 1px solid #DDD6C4; }
  .panduan details:last-child { border-bottom: 1px solid #DDD6C4; }
  .panduan summary { cursor: pointer; list-style: none; }
  .panduan summary::-webkit-details-marker { display: none; }
  .panduan summary .caret { transition: transform .3s ease; }
  .panduan details[open] summary .caret { transform: rotate(45deg); }

  /* Kotak peran */
  .role-tile {
    position: relative; overflow: hidden; border-radius: 20px; background: #fff;
    border: 1px solid #e2e8f0; padding: 1.1rem; min-height: 132px; text-align: left;
    animation: rise .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 70ms);
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, border-color .3s ease;
  }
  .role-tile::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: linear-gradient(90deg, #1E7F5C, #A3E635); transform: scaleX(0); transform-origin: left;
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .role-tile .ico {
    display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px;
    background: #E6F5EC; color: #0B3D2E; transition: transform .45s cubic-bezier(.2,.8,.2,1), background-color .3s ease, color .3s ease;
  }
  button.role-tile:not(:disabled):hover {
    transform: translateY(-6px); border-color: #1E7F5C;
    box-shadow: 0 22px 40px -18px rgba(11,61,46,.55), 0 0 0 4px rgba(163,230,53,.18);
  }
  button.role-tile:not(:disabled):hover::before { transform: scaleX(1); }
  button.role-tile:not(:disabled):hover .ico { transform: rotate(-8deg) scale(1.1); background: #A3E635; color: #0B3D2E; }
  button.role-tile:not(:disabled):active { transform: translateY(-2px) scale(.97); }
  .role-tile .lock-badge {
    position: absolute; top: 12px; right: 12px; display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: 999px; background: #F3FAF6; color: #135D46;
    animation: float 3.6s ease-in-out infinite;
  }
  .role-tile.is-locked .ico { background: #0B3D2E; color: #A3E635; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    body.print-mode * { visibility: hidden; }
    body.print-mode #print-area, body.print-mode #print-area * { visibility: visible; }
    body.print-mode #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 16px; background: #fff; }
    body.print-mode .print-only { display: block; }
  }
</style>

function normalizeDB(parsed) {
  try {
    if (!parsed || typeof parsed !== 'object') return makeSeed();
    parsed = JSON.parse(JSON.stringify(parsed));
    const base = makeSeed();
    const merged = { ...base, ...parsed, konsumsi: { ...base.konsumsi, ...(parsed.konsumsi || {}) } };
    merged.jumlahHari = Number(merged.jumlahHari) === 4 ? 4 : 3;
  const kt = merged.kartu;
  if (!kt || !Array.isArray(kt.elemen) || !Array.isArray(kt.elemenLain) || !(kt.w < kt.h)) merged.kartu = kartuDefault();
  if (merged.kartu.gradasiAktif === undefined) merged.kartu.gradasiAktif = true;
  if (!merged.kartu.gradasiArah) merged.kartu.gradasiArah = 'vertikal';
    merged.peserta.forEach(p => {
      p.checklist = Array.isArray(p.checklist) ? p.checklist : [];
      p.absen = Object.assign(blankAbsen(), p.absen || {});
    });
    return merged;
  } catch (e) {
    return makeSeed();
  }
}

/* Penyimpanan bersama: satu dokumen di database artifact, sehingga data ikut berpindah antar browser dan akun.
   localStorage tetap dipakai sebagai cadangan lokal. */
const REMOTE_PATH = 'lakmud/state-v2';
let remote = null;
let remoteSeeded = false;
let remoteTimer = null;
let remoteBusy = false;
let remoteDirty = false;
let remotePending = false;
function pushRemote() {
  if (!remote) return;
  if (remoteBusy) { remoteDirty = true; return; }
  remotePending = false;
  remoteBusy = true;
  const body = { state: JSON.parse(JSON.stringify(db)), savedAt: new Date().toISOString() };
  remote.set(body).catch(e => {
    const kode = e && e.code;
    toast(kode === 'akses' ? 'Kode akses salah. Perubahan belum tersimpan ke server.'
      : kode === 'quota_exceeded' || kode === 'invalid_argument' || kode === 'besar'
      ? 'Data terlalu besar untuk disimpan bersama. Unduh CSV dan kurangi lampiran.'
      : 'Gagal menyimpan ke server. Data tetap tersimpan di browser ini.', 'error');
  }).finally(() => {
    remoteBusy = false;
    if (remoteDirty) { remoteDirty = false; pushRemote(); }
  });
}
function save() {
  lastRaw = JSON.stringify(db);
  try {
    localStorage.setItem(KEY, lastRaw);
  } catch (e) {
    toast('Penyimpanan browser penuh atau tidak tersedia. Data mungkin tidak tersimpan.', 'error');
  }
  if (remote) {
    remotePending = true;
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(pushRemote, 300);
  }
}
function attachRemote(ns) {
  remote = ns.doc(REMOTE_PATH);
  remote.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.metadata.fromCache) return;
    if (remotePending || remoteBusy) return; // jangan timpa perubahan yang belum terkirim
    if (!snap.exists) {
      // Belum ada data bersama: unggah data lokal sebagai awal
      if (!remoteSeeded) { remoteSeeded = true; pushRemote(); }
      return;
    }
    const first = !remoteSeeded;
    remoteSeeded = true;
    const st = snap.data() && snap.data().state;
    if (!st) return;
    const raw = JSON.stringify(st);
    if (raw === lastRaw) return;
    db = normalizeDB(st);
    lastRaw = raw;
    try { localStorage.setItem(KEY, raw); } catch (e) { /* abaikan */ }
    if (!typing()) render();
    if (first) toast('Data tersambung. Perubahan dari perangkat lain akan tampil otomatis.', 'ok');
  }, err => {
    const kode = err && err.code;
    if (kode === 'tidak_tersedia') { remote = null; return; } // dibuka tanpa server: tetap lokal, diam
    if (kode === 'akses') {
      const k = window.prompt('Masukkan kode akses panitia LAKMUD:');
      if (k && k.trim()) {
        try { localStorage.setItem('lakmud-akses', k.trim()); } catch (e) { /* abaikan */ }
        remote = null; remoteSeeded = false; attachRemote(vercelNamespace());
      } else {
        remote = null;
        toast('Kode akses belum dimasukkan. Data hanya tersimpan di browser ini.', 'error');
      }
      return;
    }
    toast('Koneksi ke penyimpanan bersama terputus: ' + (err && err.message ? err.message : 'tidak diketahui'), 'error');
  });
}
/* Penyimpanan untuk hosting sendiri (Vercel): data lewat /api/state, diperbarui tiap 4 detik */
function vercelNamespace() {
  const kode = () => { try { return localStorage.getItem('lakmud-akses') || ''; } catch (e) { return ''; } };
  return { doc() { return {
    set(body) {
      return fetch('/api/state', { method: 'PUT', headers: { 'content-type': 'application/json', 'x-akses': kode() }, body: JSON.stringify(body) })
        .then(r => {
          if (r.status === 401) throw { code: 'akses' };
          if (r.status === 413) throw { code: 'besar' };
          if (!r.ok) throw { code: 'unavailable' };
        });
    },
    onSnapshot(next, err) {
      let berhenti = false, pertama = true, timer = null;
      const tarik = async () => {
        if (berhenti) return;
        try {
          const r = await fetch('/api/state', { headers: { 'x-akses': kode() }, cache: 'no-store' });
          if (r.status === 401) { berhenti = true; clearInterval(timer); err({ code: 'akses' }); return; }
          if (!r.ok) throw new Error('status ' + r.status);
          const j = await r.json();
          pertama = false;
          next({ metadata: { fromCache: false, hasPendingWrites: false }, exists: !!j.state, data: () => (j.state ? { state: j.state } : undefined) });
        } catch (e) {
          if (pertama) { berhenti = true; clearInterval(timer); err({ code: 'tidak_tersedia' }); }
        }
      };
      tarik();
      timer = setInterval(tarik, 4000);
      return () => { berhenti = true; clearInterval(timer); };
    }
  }; } };
}

  logAct(`Memperbarui ${LBL[c]}${name ? ' "' + name + '"' : ''}${patch.status ? ' menjadi ' + patch.status : ''}`);
  save(); render();

function del(c, id) {
  if (!confirm('Hapus data ini? Tindakan ini tidak dapat dibatalkan.')) return;
  const it = db[c].find(x => x.id === id);
  db[c] = db[c].filter(x => x.id !== id);
  logAct(`Menghapus ${LBL[c]}${it && label(it) ? ' "' + label(it) + '"' : ''}`);

/* Simpan berkas: lewat kapabilitas downloads bila tersedia (artifact), jika tidak lewat tautan unduh biasa */
async function simpanFile(nama, blob) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      const hasil = await dl.save({ filename: nama, data: blob });
      if (hasil && hasil.status === 'saved') toast('File CSV disimpan (bisa dibuka di Excel)');
      return;
    }
  } catch (e) { /* jatuh ke tautan unduh biasa */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('File CSV diunduh (bisa dibuka di Excel)');
}

const cacheGambar = {};
function muatGambar(src) {
  if (!src) return Promise.resolve(null);
  if (cacheGambar[src]) return Promise.resolve(cacheGambar[src]);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { cacheGambar[src] = im; res(im); };
    im.onerror = () => res(null);
    im.src = src;
  });
}
function buatQR(teks, px) {
  if (typeof QRCode === 'undefined') return null;
  const tmp = document.createElement('div');
  try {
    new QRCode(tmp, { text: teks, width: px, height: px, correctLevel: QRCode.CorrectLevel.M });
    return tmp.querySelector('canvas');
  } catch (e) { return null; }
}
function buatBarcode(teks, lebar = 2, tinggi = 80, tampilTeks = false) {
  if (typeof JsBarcode === 'undefined') return null;
  const c = document.createElement('canvas');
  try {
    JsBarcode(c, String(teks), { format: 'CODE128', displayValue: tampilTeks, margin: 0, width: lebar, height: tinggi });
    return c;
  } catch (e) { return null; }
}
function rrPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r); g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h); g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r); g.arcTo(x, y, x + r, y, r);
  g.closePath();
}
function bintang(g, cx, cy, R, n, dalam) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const sudut = Math.PI * i / n - Math.PI / 2, jari = i % 2 ? R * dalam : R;
    const px = cx + jari * Math.cos(sudut), py = cy + jari * Math.sin(sudut);
    i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
  }
  g.closePath();
}
async function gambarKartu(d, p, k, daftar = d.elemen) {

  if (d.gradasiAktif && d.bg2) {
    const gr = d.gradasiArah === 'horizontal' ? g.createLinearGradient(0, 0, W, 0) : d.gradasiArah === 'diagonal' ? g.createLinearGradient(0, 0, W, H) : g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, d.bg || '#FFFFFF'); gr.addColorStop(1, d.bg2);
    g.fillStyle = gr;
  } else {
    g.fillStyle = d.bg || '#FFFFFF';
  }
  g.fillRect(0, 0, W, H);
  for (const e of daftar) {
    const x = e.x * k, y = e.y * k, w = e.w * k, h = e.h * k;
    g.save();
    const fam = e.font === 'serif' ? "'Fraunces', Georgia, serif" : "'Source Sans 3', Arial, sans-serif";

function hapusLatarDataUrl(im) {
  const s = Math.min(1, 240 / Math.max(im.width, im.height));
  const w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));

    const i = k * 4;
    const dr = px[i] - r, dg = px[i + 1] - gh, db2 = px[i + 2] - bi;
    return px[i + 3] > 0 && Math.sqrt(dr * dr + dg * dg + db2 * db2) <= 70;

  for (let x = 0; x < w; x++) { ambil(x); ambil((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { ambil(y * w); ambil(y * w + w - 1); }
  while (tumpukan.length) {
    const k = tumpukan.pop(), x = k % w, y = (k - x) / w;
    if (x > 0) ambil(k - 1);
    if (x < w - 1) ambil(k + 1);
    if (y > 0) ambil(k - w);
    if (y < h - 1) ambil(k + w);
  }
  for (let k = 0; k < w * h; k++) if (tandai[k]) px[k * 4 + 3] = 0;
  g.putImageData(data, 0, 0);
  return c.toDataURL('image/png');
}

function catatScan(kode) {
  const teksScan = String(kode || '').trim();
  const kodeBaris = (teksScan.match(/KODE:\s*(\S+)/i) || [])[1] || '';
  const cari = kodeBaris || teksScan.replace(/^LAKMUD:/i, '');
  const hari = 'd' + scanHari;
  const p = db.peserta.find(x => x.id === cari || (x.kode && x.kode.toUpperCase() === cari.toUpperCase()));
  const waktu = new Date().toTimeString().slice(0, 5);
  let ok = false, pesan;
  if (!canWrite('peserta')) pesan = 'Peran Anda tidak bisa mencatat absensi.';
  else if (!cari) pesan = 'Kode kosong.';
  else if (!p) pesan = 'Kode tidak dikenal: ' + cari;
  else if (p.absen[hari][scanMode]) pesan = p.nama + ' sudah tercatat ' + MODE_ABSEN[scanMode] + ' pukul ' + p.absen[hari][scanMode] + '.';
  else {
    p.absen[hari][scanMode] = waktu; ok = true;
    pesan = p.nama + ': ' + MODE_ABSEN[scanMode] + ' Hari ' + scanHari + ' pukul ' + waktu;
    logAct('Scan absensi ' + p.nama + ' (' + MODE_ABSEN[scanMode] + ', Hari ' + scanHari + ')');
    save();
  }
  scanTerbaru.unshift({ ok, pesan, waktu });
  scanTerbaru = scanTerbaru.slice(0, 20);
  if (!typing()) render();
  return { ok, pesan };
}

function setScanMode(v) { scanMode = v; segarInfoScan(); render(); }
function segarInfoScan() {
  const info = $('#scan-info');
  if (info) info.textContent = 'Hari ' + scanHari + ' · ' + MODE_ABSEN[scanMode];

  if (h) h.value = String(scanHari);
  if (m) m.value = scanMode;
}

  const v = $('#scan-video'), st = $('#scan-status');
  st.textContent = 'Meminta akses kamera...';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    st.textContent = 'Kamera tidak didukung di browser ini. Gunakan input manual.'; return;
  }
  if (typeof jsQR === 'undefined') {
    st.textContent = 'Pustaka pemindai belum termuat. Periksa koneksi internet, atau gunakan input manual.'; return;
  }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    v.srcObject = scanStream;
    await v.play();
    st.textContent = 'Arahkan QR code peserta ke kamera.';
    const cv = $('#scan-canvas');
    const g = cv.getContext('2d', { willReadFrequently: true });
    const loop = () => {
      if (!scanStream) return;
      scanFrame++;
      if (v.readyState >= 2 && v.videoWidth && scanFrame % 3 === 0) {
        const s = Math.min(1, 640 / v.videoWidth);
        cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
        g.drawImage(v, 0, 0, cv.width, cv.height);
        const img = g.getImageData(0, 0, cv.width, cv.height);
        const kode = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (kode && kode.data) prosesKode(kode.data);
      }
      scanRaf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    st.textContent = 'Kamera tidak bisa dibuka. Pastikan izin kamera diberikan, atau gunakan input manual.';
  }
}
function prosesKode(data) {
  const now = Date.now();
  if (data === scanTerakhir.kode && now - scanTerakhir.waktu < 2500) return;
  scanTerakhir = { kode: data, waktu: now };
  const r = catatScan(data);
  const st = $('#scan-status');
  if (st) { st.textContent = r.pesan; st.className = 'mt-3 text-sm font-semibold ' + (r.ok ? 'text-ipnu-700' : 'text-rose-700'); }
}
function tutupScanner() {
  if (scanRaf) cancelAnimationFrame(scanRaf);
  scanRaf = null;
  if (scanStream) scanStream.getTracks().forEach(t => t.stop());
  scanStream = null;
  const v = $('#scan-video');
  if (v) v.srcObject = null;
  $('#scan-modal').classList.add('hidden');
  render();
}

/* ================= PEMBUATAN QR CODE PESERTA ================= */
let qrPrevId = '';
const BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const tglIndo = v => { if (!v) return ''; const [y, m, d] = String(v).split('-'); return (Number(d) || '') + ' ' + (BULAN_ID[Number(m) - 1] || '') + ' ' + y; };
const kodeBaru = () => { db.kodeSeq = (Number(db.kodeSeq) || 0) + 1; return 'LKM-' + String(db.kodeSeq).padStart(3, '0'); };
function qrTeks(p) {
  const ttl = [p.tempatLahir, tglIndo(p.tglLahir)].filter(Boolean).join(', ');
  return ['LAKMUD', 'KODE: ' + p.kode, 'NAMA: ' + p.nama, 'TEMPAT, TANGGAL LAHIR: ' + (ttl || '-'), 'ALAMAT: ' + (p.alamat || '-'), 'ASAL: ' + (p.asal || '-')].join('\n');
}
function gambarQRPeserta(p) {
  const W = 600, H = 700, q = buatQR(qrTeks(p), 440);
  if (!q) return null;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  g.drawImage(q, (W - 440) / 2, 30, 440, 440);
  const font = "'Source Sans 3', Arial, sans-serif";
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#0B3D2E'; g.font = '700 40px ' + font; g.fillText(p.nama, W / 2, 530);
  g.fillStyle = '#1E7F5C'; g.font = '700 30px ' + font; g.fillText(p.kode, W / 2, 582);
  g.fillStyle = '#334155'; g.font = '400 26px ' + font; g.fillText(p.asal || '', W / 2, 630);
  return cv;
}
const qrPrevPeserta = () => db.peserta.find(x => x.id === qrPrevId) || db.peserta[0] || null;
function qrRefresh() {
  const c = $('#qr-pratinjau'), p = qrPrevPeserta();
  if (!c || !p || !p.kode) return;
  const cv = gambarQRPeserta(p);
  if (!cv) return;
  c.width = cv.width; c.height = cv.height;
  c.getContext('2d').drawImage(cv, 0, 0);
}
function qrPilih(id) { qrPrevId = id; render(); }
function qrBuatKode(pid) {
  const p = db.peserta.find(x => x.id === pid);

  const baris = db.peserta.map(x => `<tr class="border-t border-ipnu-100 align-top">
    <td class="py-2 pr-3"><p class="font-semibold text-ipnu-900">${esc(x.nama)}</p><p class="font-mono text-xs text-slate-500">${x.kode ? esc(x.kode) : '<span class="text-amber-700">Belum ada kode</span>'}</p></td>
    <td class="pr-2"><input type="text" value="${esc(x.asal || '')}" ${dis} onchange="qrUbah('${x.id}','asal',this.value)" class="w-40 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></td>
    <td class="pr-2"><input type="text" value="${esc(x.alamat || '')}" ${dis} onchange="qrUbah('${x.id}','alamat',this.value)" class="w-56 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></td>
    <td class="pr-2"><input type="text" value="${esc(x.tempatLahir || '')}" ${dis} onchange="qrUbah('${x.id}','tempatLahir',this.value)" class="w-36 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></td>
    <td class="pr-2"><input type="date" value="${esc(x.tglLahir || '')}" ${dis} onchange="qrUbah('${x.id}','tglLahir',this.value)" class="rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></td>
    <td class="py-2"><div class="flex flex-wrap gap-2">
      ${!x.kode && bisa ? `<button type="button" onclick="qrBuatKode('${x.id}')" class="${tb}">Buat kode</button>` : ''}
      ${x.kode ? `<button type="button" onclick="qrPilih('${x.id}')" class="${tb}">Pratinjau</button><button type="button" onclick="qrUnduh('${x.id}')" class="${tb}">Unduh QR</button>` : ''}
    </div></td></tr>`).join('');
  return `<div class="mx-auto max-w-6xl space-y-6">
    ${head('Pembuatan QR Code', 'Isi data peserta, buat kode peserta, lalu unduh QR code. Data di dalam QR dibaca oleh Scan Absensi.',
      (bisa ? `<button type="button" onclick="qrBuatKodeSemua()" class="rounded-lg border border-ipnu-500 bg-white px-3 py-2 text-sm font-semibold text-ipnu-700">Buat kode semua</button>` : '') +
      `<button type="button" onclick="qrUnduhSemua()" class="rounded-lg bg-ipnu-700 px-4 py-2 text-sm font-semibold text-white">Unduh semua QR (PNG)</button>`)}
    ${bisa ? '' : '<p class="rounded-xl bg-amber-50 p-3 text-sm text-amber-900">Anda bisa melihat dan mengunduh QR. Hanya Sekretaris, Ketua, dan Wakil yang bisa mengubah data.</p>'}
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_340px]">
      ${card('Data peserta', `<div class="-mx-5 overflow-x-auto px-5"><table class="min-w-full text-left text-sm">
        <thead><tr class="text-xs uppercase tracking-wider text-slate-500"><th class="py-2 pr-3">Nama dan kode</th><th class="pr-2">Asal ranting/PAC</th><th class="pr-2">Alamat</th><th class="pr-2">Tempat lahir</th><th class="pr-2">Tanggal lahir</th><th>Aksi</th></tr></thead>
        <tbody>${baris || '<tr><td colspan="6" class="py-6 text-center text-slate-400">Belum ada peserta</td></tr>'}</tbody>
      </table></div>`)}
      ${card('Pratinjau QR', `<label class="mb-4 block text-xs font-semibold text-slate-600">Peserta<select onchange="qrPilih(this.value)" class="mt-1 block w-full rounded-lg border border-ipnu-300 px-2 py-2 text-sm">${opsi}</select></label>${pratinjau}`)}
    </div>
  </div>`;
}

/* Halaman ID Card & QR (tidak lagi ditampilkan di menu) */
function elemenPanelHTML(e, bisa) {
  const dis = bisa ? '' : 'disabled';
  const angka = (f, lbl, step = '0.1') => `<label class="block text-xs font-semibold text-slate-600">${lbl}<input type="number" step="${step}" value="${e[f] ?? ''}" ${dis} onchange="kartuUbah('${f}',this.value)" class="mt-1 w-full rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>`;
  const warna = (f, lbl) => `<label class="block text-xs font-semibold text-slate-600">${lbl}<input type="color" value="${e[f] || '#0B3D2E'}" ${dis} onchange="kartuUbah('${f}',this.value)" class="mt-1 h-9 w-full rounded-lg border border-ipnu-300" /></label>`;
  const cmIn = (f, lbl) => `<label class="block text-xs font-semibold text-slate-600">${lbl}<input type="number" step="0.01" value="${((e[f] || 0) / 10).toFixed(2)}" ${dis} onchange="kartuUbah('${f}',this.value)" class="mt-1 w-full rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>`;
  let isi = '';
  if (e.tipe === 'teks') {
    isi = `<label class="block text-xs font-semibold text-slate-600">Isi teks (pakai {{nama}}, {{asal}}, {{jk}}, {{id}}, {{kegiatan}})
      <textarea rows="2" ${dis} onchange="kartuUbah('teks',this.value)" class="mt-1 w-full rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm">${esc(e.teks)}</textarea></label>
      <div class="grid grid-cols-2 gap-2">${angka('ukuran', 'Ukuran (pt)', '0.5')}${warna('warna', 'Warna')}</div>
      <label class="flex items-center gap-2 text-sm font-semibold text-slate-700"><input type="checkbox" ${e.tebal ? 'checked' : ''} ${dis} onchange="kartuUbah('tebal',this.checked)" /> Tebal</label>
      <label class="block text-xs font-semibold text-slate-600">Rata
        <select ${dis} onchange="kartuUbah('rata',this.value)" class="mt-1 w-full rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm">
          ${['left', 'center', 'right'].map(r => `<option value="${r}" ${e.rata === r ? 'selected' : ''}>${{ left: 'Kiri', center: 'Tengah', right: 'Kanan' }[r]}</option>`).join('')}
        </select></label>
      <label class="flex items-center gap-2 text-sm font-semibold text-slate-700"><input type="checkbox" ${e.font === 'serif' ? 'checked' : ''} ${dis} onchange="kartuUbah('font',this.checked?'serif':'sans')" /> Font serif</label>`;
  } else if (e.tipe === 'kotak') {
    isi = warna('warna', 'Warna kotak') + cmIn('r', 'Sudut bulat (cm)');
  } else if (e.tipe === 'hiasan') {
    isi = warna('warna', 'Warna hiasan');
  } else if (e.tipe === 'qr' || e.tipe === 'barcode') {
    isi = `<label class="block text-xs font-semibold text-slate-600">Isi kode (kosong = ID peserta)<input type="text" value="${esc(e.isi || '')}" ${dis} onchange="kartuUbah('isi',this.value)" placeholder="contoh: https://... atau {{medsos}}" class="mt-1 w-full rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>`;
  } else if (e.tipe === 'gambar') {
    isi = `<label class="block rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-center text-sm font-semibold text-ipnu-700 ${bisa ? 'cursor-pointer' : 'opacity-40'}">${e.logo ? 'Ganti dengan gambar lain' : 'Ganti gambar'}<input type="file" accept="image/*" class="hidden" ${dis} onchange="kartuUpload(this,'${e.id}')" /></label>`;
  }
  const tombol = (aksi, teks) => `<button type="button" ${dis} onclick="${aksi}" class="rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-sm font-semibold text-ipnu-700 disabled:opacity-40">${teks}</button>`;
  return `<div class="space-y-3">
    <p class="text-sm font-extrabold text-ipnu-900">${KARTU_TIPE[e.tipe]}</p>
    <div class="grid grid-cols-2 gap-2">${cmIn('x', 'X (cm)')}${cmIn('y', 'Y (cm)')}${cmIn('w', 'Lebar (cm)')}${cmIn('h', 'Tinggi (cm)')}</div>
    ${isi}
    <p class="pt-1 text-xs font-bold uppercase tracking-wider text-slate-500">Sejajarkan terhadap kartu</p>
    <div class="flex flex-wrap gap-2">
      ${tombol("kartuSejajar('kiri')", 'Kiri')}${tombol("kartuSejajar('tengahH')", 'Tengah H')}${tombol("kartuSejajar('kanan')", 'Kanan')}
      ${tombol("kartuSejajar('atas')", 'Atas')}${tombol("kartuSejajar('tengahV')", 'Tengah V')}${tombol("kartuSejajar('bawah')", 'Bawah')}
    </div>
    <div class="flex flex-wrap gap-2 pt-1">
      ${tombol('kartuDuplikat()', 'Duplikat')}
      ${tombol('kartuUrut(1)', 'Naik lapisan')}${tombol('kartuUrut(-1)', 'Turun lapisan')}
      <button type="button" ${dis} onclick="kartuHapus()" class="rounded-lg border border-rose-300 bg-white px-3 py-1.5 text-sm font-semibold text-rose-700 disabled:opacity-40">Hapus elemen</button>
    </div>
  </div>`;
}
function kartuPageHTML() {
  const d = db.kartu, bisa = kartuCanEdit(), e = selEl();
  const dis = bisa ? '' : 'disabled';
  const sisiTombol = ['depan', 'belakang'].map(sisi => `<button type="button" ${dis} onclick="kartuSisi('${sisi}')" class="rounded-xl border px-4 py-2 text-sm font-bold disabled:opacity-60 ${d.sisi === sisi ? 'border-ipnu-700 bg-ipnu-700 text-white' : 'border-ipnu-500 bg-white text-ipnu-700'}">${sisi === 'depan' ? 'Sisi depan' : 'Sisi belakang'}</button>`).join('');
  const ukuranPx = `aspect-ratio:${d.w} / ${d.h}`;
  const sisiKotak = sisi => { const aktif = d.sisi === sisi; return `<div class="relative select-none rounded-lg ${aktif ? 'ring-2 ring-ipnu-500' : 'cursor-pointer opacity-80 hover:opacity-100'}" style="${ukuranPx}" onclick="kartuSisi('${sisi}')"><span class="absolute left-2 top-2 z-10 rounded bg-white/90 px-2 py-0.5 text-[11px] font-bold text-ipnu-900">${sisi === 'depan' ? 'Depan' : 'Belakang'}</span><canvas id="kartu-canvas-${sisi}" class="absolute inset-0 h-full w-full rounded-lg shadow-lg"></canvas>${aktif ? hit : ''}</div>`; };
  const chip = k => `<button type="button" ${dis} onclick="kartuUkuran('${k}')" class="rounded-xl border px-4 py-2 text-sm font-bold disabled:opacity-60 ${d.ukuran === k ? 'border-ipnu-700 bg-ipnu-700 text-white' : 'border-ipnu-500 bg-white text-ipnu-700'}">${k} <span class="ml-1 text-[11px] font-semibold opacity-80">${(KARTU_UKURAN[k].w / 10).toFixed(1)} x ${(KARTU_UKURAN[k].h / 10).toFixed(1)} cm</span></button>`;
  const tambah = Object.keys(KARTU_TIPE).filter(t => t !== 'gambar').map(t => `<button type="button" ${dis} onclick="kartuTambah('${t}')" class="rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-sm font-semibold text-ipnu-700 disabled:opacity-40">+ ${KARTU_TIPE[t]}</button>`).join('') + [['lingkaran', 'Logo IPNU'], ['segitiga', 'Logo IPPNU']].map(([k, l]) => `<button type="button" ${dis} onclick="kartuLogo('${k}')" class="rounded-lg border border-gold-hl bg-white px-3 py-1.5 text-sm font-semibold text-ipnu-900 disabled:opacity-40">+ ${l}</button>`).join('');
  const hit = d.elemen.map(x => `<div class="kartu-hit ${x.id === kartuSel ? 'is-sel' : ''}" data-el="${x.id}" style="left:${x.x / d.w * 100}%;top:${x.y / d.h * 100}%;width:${x.w / d.w * 100}%;height:${x.h / d.h * 100}%"></div>`).join('');
  const opsi = [`<option value="">Contoh data</option>`].concat(db.peserta.map(p => `<option value="${esc(p.id)}" ${p.id === kartuPrevId ? 'selected' : ''}>${esc(p.nama)}</option>`)).join('');
  const baris = db.peserta.map(p => {
    const b = (aksi, teks) => `<button type="button" onclick="${aksi}" class="rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-xs font-semibold text-ipnu-700">${teks}</button>`;
    return `<tr class="border-t border-ipnu-100">
      <td class="py-2 pr-3 font-semibold text-ipnu-900">${esc(p.nama)}<div class="font-mono text-[11px] font-normal text-slate-400">${esc(p.id)}</div></td>
      <td class="pr-3"><input type="text" value="${esc(p.medsos || '')}" ${dis} onchange="kartuMedsos('${p.id}',this.value)" placeholder="@username" class="w-36 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></td>
      <td class="pr-3"><div class="flex flex-wrap items-center gap-2">
        ${p.foto ? `<img src="${p.foto}" alt="Foto ${esc(p.nama)}" class="h-12 w-10 rounded bg-ipnu-100 object-contain" />` : '<span class="text-xs text-slate-400">Belum ada</span>'}
        <label class="rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-xs font-semibold text-ipnu-700 ${bisa ? 'cursor-pointer' : 'opacity-40'}">Unggah<input type="file" accept="image/*" class="hidden" ${dis} onchange="kartuFotoPeserta('${p.id}',this)" /></label>
        ${p.foto && bisa ? b("kartuLatarPeserta('" + p.id + "')", 'Hapus latar') + b("kartuFotoHapus('" + p.id + "')", 'Hapus foto') : ''}
      </div></td>
      <td class="py-2"><div class="flex flex-wrap gap-2">
        ${b("bukaPratinjauKartu('" + p.id + "')", 'Pratinjau')}
        ${b("unduhKartu('" + p.id + "')", 'Unduh kartu')}
        ${b("unduhKode('" + p.id + "','qr')", 'Unduh QR')}
        ${b("unduhKode('" + p.id + "','barcode')", 'Unduh barcode')}
      </div></td></tr>`;
  }).join('');
  return `<div class="mx-auto max-w-6xl space-y-6">
    <header>
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-ipnu-500">ID Card</p>
      <h1 class="text-3xl font-extrabold text-ipnu-900">ID Card & QR Code</h1>
      <p class="mt-1 text-slate-600">Atur desain kartu, lalu seret elemen di atas kartu untuk menata tata letaknya. QR dan barcode dibuat otomatis dari kode setiap peserta.</p>
    </header>
    ${bisa ? '' : '<p class="rounded-xl bg-amber-50 p-3 text-sm text-amber-900">Anda bisa melihat dan mengunduh kartu, tetapi hanya Ketua, Wakil, dan Sekretaris yang bisa mengubah desain.</p>'}
    <section class="rounded-2xl bg-white p-5 space-y-4">
      <div class="flex flex-wrap items-center gap-2"><span class="w-20 text-sm font-semibold text-slate-600">Ukuran potret</span>${['B1', 'B2', 'B3', 'B4'].map(chip).join('')}</div>
      <div class="flex flex-wrap items-end gap-3">
        <label class="text-xs font-semibold text-slate-600">Lebar (cm)<input type="number" step="0.01" value="${(d.w / 10).toFixed(2)}" ${dis} onchange="kartuUkuranManual('w',this.value)" class="mt-1 w-24 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>
        <label class="text-xs font-semibold text-slate-600">Tinggi (cm)<input type="number" step="0.01" value="${(d.h / 10).toFixed(2)}" ${dis} onchange="kartuUkuranManual('h',this.value)" class="mt-1 w-24 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>
        <label class="text-xs font-semibold text-slate-600">Warna latar atas<input type="color" value="${d.bg}" ${dis} onchange="kartuLatar(this.value)" class="mt-1 block h-9 w-16 rounded-lg border border-ipnu-300" /></label>
        <label class="text-xs font-semibold text-slate-600">Warna latar bawah<input type="color" value="${d.bg2 || d.bg}" ${dis} onchange="kartuSet('bg2',this.value)" class="mt-1 block h-9 w-16 rounded-lg border border-ipnu-300" /></label>
        <label class="flex items-center gap-2 text-xs font-semibold text-slate-600"><input type="checkbox" ${d.gradasiAktif ? 'checked' : ''} ${dis} onchange="kartuSet('gradasiAktif',this.checked)" /> Gradasi</label>
        <label class="text-xs font-semibold text-slate-600">Arah gradasi<select ${dis} onchange="kartuSet('gradasiArah',this.value)" class="mt-1 block rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm">${[['vertikal', 'Vertikal'], ['horizontal', 'Horizontal'], ['diagonal', 'Diagonal']].map(([v, l]) => `<option value="${v}" ${d.gradasiArah === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="text-xs font-semibold text-slate-600">Nama kegiatan<input type="text" value="${esc(d.kegiatan || '')}" ${dis} onchange="kartuSet('kegiatan',this.value)" class="mt-1 block w-56 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>
        <label class="text-xs font-semibold text-slate-600">Medsos default<input type="text" value="${esc(d.medsos || '')}" ${dis} onchange="kartuSet('medsos',this.value)" placeholder="@username" class="mt-1 block w-44 rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm" /></label>
        <label class="text-xs font-semibold text-slate-600">Pratinjau dengan<select onchange="kartuPrevId=this.value; kartuRefresh()" class="mt-1 block rounded-lg border border-ipnu-300 px-2 py-1.5 text-sm">${opsi}</select></label>
      </div>
      <div class="flex flex-wrap gap-2">${tambah}
        <label class="rounded-lg border border-ipnu-500 bg-white px-3 py-1.5 text-sm font-semibold text-ipnu-700 ${bisa ? 'cursor-pointer' : 'opacity-40'}">+ Unggah gambar<input type="file" accept="image/*" class="hidden" ${dis} onchange="kartuUpload(this)" /></label>
      </div>
    </section>
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_320px]">
      <section class="rounded-2xl bg-white p-5">
        <p class="mb-2 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Satu ID card: depan dan belakang</p>
        <canvas id="kartu-gabungan" class="mx-auto block w-full rounded-lg shadow-lg"></canvas>
        <p class="mb-2 mt-6 text-center text-xs font-bold uppercase tracking-wider text-slate-500">Editor: ${d.sisi === 'depan' ? 'sisi depan' : 'sisi belakang'}</p>
        <div class="mb-3 flex justify-center gap-2">${sisiTombol}</div>
        <div class="relative mx-auto select-none rounded-lg" style="aspect-ratio:${d.w} / ${d.h};max-width:${d.w < d.h ? 300 : 600}px"><canvas id="kartu-editor" class="absolute inset-0 h-full w-full rounded-lg shadow-lg"></canvas>${hit}</div>
        <p class="mt-3 text-center text-xs text-slate-500">${bisa ? 'Klik lalu seret elemen untuk memindahkannya.' : ''}</p>
      </section>
      <aside class="rounded-2xl bg-white p-5">
        <h2 class="mb-3 text-lg font-extrabold text-ipnu-900">Elemen</h2>

        </div>
      </aside>
    </div>
    <section class="rounded-2xl bg-white p-5">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">

        <button type="button" onclick="unduhSemuaKartu()" class="rounded-lg bg-ipnu-700 px-4 py-2 text-sm font-semibold text-white">Unduh semua kartu (PNG)</button>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-left text-sm">

        <tbody>${baris || '<tr><td colspan="4" class="py-4 text-slate-500">Tambahkan peserta di halaman Peserta terlebih dahulu.</td></tr>'}</tbody>
      </table></div>
    </section>

}

/* Timer rundown: teks diperbarui tiap detik, render ulang hanya saat status sesi berubah */
let lastStatusSig = '';
setInterval(() => {
  if (!role || page !== 'rundown') return;
  let sig = '';
  db.sessions.forEach(s => {
    const st = sessStatus(s);
    sig += s.id + st.key + ';';
    const t = document.querySelector(`[data-timer="${s.id}"]`);
    if (t) t.textContent = st.ms > 0 ? st.lbl + ' ' + fmtMs(st.ms) : '';
  });
  if (sig !== lastStatusSig) { lastStatusSig = sig; if (!typing()) render(); }
}, 1000);

/* Sinkronisasi langsung: perubahan dari tab atau jendela lain langsung tampil */
function syncFromStorage() {
  if (remote) return;
  const raw = localStorage.getItem(KEY);
  if (raw === null || raw === lastRaw) return;
  lastRaw = raw;
  db = loadDB();
  if (!typing()) render();
}
window.addEventListener('storage', e => { if (e.key === KEY || e.key === ROLE_KEY) syncFromStorage(); });
setInterval(syncFromStorage, 3000);

window.addEventListener('error', e => { console.error(e.error || e.message); });

ensureModals();
render();
</script>
